<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratory Report QR Poster</title><style>body{font:18px/1.5 system-ui,sans-serif;text-align:center;color:#0f172a;margin:0;padding:32px}main{max-width:650px;margin:auto;padding:32px;border:2px solid #2563eb;border-radius:12px}#qr{width:300px;height:300px;max-width:100%;margin:24px 0}#url{overflow-wrap:anywhere;font-size:14px}.no-print{margin-bottom:20px}button{padding:12px 24px;cursor:pointer}@page{size:A4;margin:15mm}@media print{.no-print{display:none}body{padding:0}main{break-inside:avoid}} </style></head><body><div class="no-print"><button onclick="window.print()">Print Poster</button></div><main><img src="images/olfu-logo.png" alt="OLFU" width="70"><h2>Our Lady of Fatima University</h2><p>College of Pharmacy · PharmaLab</p><h1 id="title">Laboratory Report</h1><p>Scan to open the form and submit for laboratory staff review.</p><img id="qr" alt="Report QR Code"><p id="url"></p><p>Students and faculty may submit without signing in.<br>Photos are optional.</p><p id="notice"></p></main><script src="js/laboratory-report-common.js"></script><script>const type=new URLSearchParams(location.search).get('type');if(LabReports.types[type]){const url='https://olfupharmalab.vercel.app/laboratory-report.html?type='+type;document.getElementById('title').textContent=LabReports.types[type];document.getElementById('url').textContent=url;document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data='+encodeURIComponent(url);if(type==='incident')document.getElementById('notice').textContent='For emergencies, inform laboratory staff immediately.';}else{document.getElementById('title').textContent='Invalid report type';document.getElementById('qr').hidden=true;}</script></body></html>
